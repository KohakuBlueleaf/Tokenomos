name: CI

on:
  push:
    branches: [main]
  pull_request:

# A compute project: CI checks the code's form, the Rust core and every test that needs no GPU;
# kernels and engines are checked by the suite and the benches on the cards
jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Install the built wheel
        shell: bash
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[dev,tensorcore]"
      - name: Tests
        run: python -m pytest tests -q -m "not gpu"

  rust:
    name: Rust (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      # Without the python feature the test binary links nothing of Python
      - name: cargo test
        run: cargo test --no-default-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install black ruff
      - name: black
        run: python -m black --check --line-length 100 src tests bench scripts
      - name: ruff
        run: python -m ruff check src tests bench scripts
      - name: Markdown code blocks
        run: python scripts/check_md_black.py .
